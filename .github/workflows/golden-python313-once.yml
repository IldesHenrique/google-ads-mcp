name: Temporary regenerate tool golden on Python 3.13
on:
  push:
    branches: [feature/ads-management-full-suite]
    paths: ['.github/workflows/golden-python313-once.yml']
permissions:
  contents: write
jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ads-management-full-suite
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install .
      - name: Generate exact tool fixture on Python 3.13
        run: |
          python - <<'PY'
          from tests.smoke import smoke_utils
          import json
          from pathlib import Path
          tools = smoke_utils.get_tools_list()
          tools["tools"].sort(key=lambda x: x.get("name", ""))
          output = Path("tests/smoke/golden_tools_list.json")
          output.write_text(json.dumps(tools, indent=2, sort_keys=True) + "\n")
          PY
      - name: Commit generated golden file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/smoke/golden_tools_list.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate tool fixture using Python 3.13"
            git push origin HEAD:feature/ads-management-full-suite
          fi
