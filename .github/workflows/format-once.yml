name: Temporary formatting and smoke fixtures
on:
  push:
    branches: [feature/ads-management-full-suite]
    paths: ['.github/workflows/format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ads-management-full-suite
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: python -m pip install . black
      - name: Format modified Python files
        run: black -l 80 ads_mcp/tools/campaign_writes.py ads_mcp/tools/ads_management.py tests/test_ads_management.py tests/test_google_ads_sdk_contract.py
      - name: Refresh smoke golden tool list
        run: |
          python - <<'PY'
          from tests.smoke import smoke_utils
          import json
          from pathlib import Path
          tools = smoke_utils.get_tools_list()
          tools["tools"].sort(key=lambda x: x.get("name", ""))
          path = Path("tests/smoke/golden_tools_list.json")
          path.write_text(json.dumps(tools, indent=2, sort_keys=True) + "\n")
          PY
      - name: Push formatting and fixtures to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ads_mcp/tools/campaign_writes.py ads_mcp/tools/ads_management.py tests/test_ads_management.py tests/test_google_ads_sdk_contract.py tests/smoke/golden_tools_list.json
          if ! git diff --cached --quiet; then
            git commit -m "Format Google Ads write suite and update smoke fixture"
            git push origin HEAD:feature/ads-management-full-suite
          fi
